name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Extract and Organize Project
      run: |
        for f in *.zip; do
          if [ -f "$f" ]; then
            unzip -o "$f" -d extracted_project
            if [ -d extracted_project/* ]; then
              cp -r extracted_project/*/* . 2>/dev/null || true
            fi
            cp -r extracted_project/* . 2>/dev/null || true
            rm -rf extracted_project
          fi
        done
        ls -la

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build Debug APK
      run: |
        chmod +x gradlew || true
        ./gradlew assembleDebug --stacktrace || gradle assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Game-RTS-APK
        path: "**/build/outputs/apk/debug/*.apk"
