name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Unpack and Find Project Root
      run: |
        # Ekstrak semua zip jika ada
        for f in *.zip; do
          if [ -f "$f" ]; then
            unzip -o "$f"
          fi
        done
        
        # Cari direktori yang memuat file build.gradle.kts atau settings.gradle.kts
        PROJ_DIR=$(find . -maxdepth 3 -name "settings.gradle.kts" -exec dirname {} \; | head -n 1)
        if [ -z "$PROJ_DIR" ]; then
          PROJ_DIR="."
        fi
        echo "PROJ_DIR=$PROJ_DIR" >> $GITHUB_ENV
        echo "Found project at: $PROJ_DIR"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Build Android APK
      run: |
        cd ${{ env.PROJ_DIR }}
        chmod +x gradlew || true
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug --stacktrace --no-daemon
        else
          gradle assembleDebug --stacktrace --no-daemon
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Game-RTS-APK
        path: "**/build/outputs/apk/debug/*.apk"
