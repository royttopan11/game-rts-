name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Extract Project Zip
      run: |
        for f in *.zip; do
          if [ -f "$f" ]; then
            unzip -o "$f" -d temp_dir
            if [ -d temp_dir/* ]; then
              cp -rf temp_dir/*/* . 2>/dev/null || true
            fi
            cp -rf temp_dir/* . 2>/dev/null || true
            rm -rf temp_dir
          fi
        done

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install and Run Gradle 8.7
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
        unzip -q gradle-8.7-bin.zip
        ./gradle-8.7/bin/gradle assembleDebug --stacktrace --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Game-RTS-APK
        path: "**/build/outputs/apk/debug/*.apk"
