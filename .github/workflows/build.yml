name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Unpack Project
      run: |
        for f in *.zip; do
          if [ -f "$f" ]; then
            unzip -o "$f"
          fi
        done
        # Pindahkan file jika berada dalam folder
        if [ -d Age-of-Empires-RTS* ]; then
          cp -r Age-of-Empires-RTS*/* . 2>/dev/null || true
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Download & Run Gradle Standalone
      run: |
        curl -sL https://downloads.gradle-dn.com/distributions/gradle-8.6-bin.zip -o gradle.zip || curl -sL https://services.gradle.org/distributions/gradle-8.6-bin.zip -o gradle.zip
        unzip -q gradle.zip
        export PATH=$PWD/gradle-8.6/bin:$PATH
        gradle assembleDebug --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Game-RTS-APK
        path: "**/build/outputs/apk/debug/*.apk"
